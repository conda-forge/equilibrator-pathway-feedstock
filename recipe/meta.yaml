{% set name = "equilibrator-pathway" %}
{% set version = "0.8.0" %}
{% set python_min = "3.11" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 17e267bbdae18c63fc3f4b821523636ebe46aa91c761f91e722e1388a1e2fb48

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=41
    - setuptools-scm
    - wheel
    - setuptools-git-versioning >=2.0,<3
    - pip
  run:
    - python >={{ python_min }}
    - pybind11 ~=2.11
    - matplotlib-base ~=3.10
    - cvxpy ~=1.8
    - sbtabpy >=1.0.8
    - equilibrator-api ~=0.7.0
    - equilibrator-cache ~=0.7.1

test:
  imports:
    - equilibrator_pathway
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://gitlab.com/equilibrator/equilibrator-pathway
  summary: Pathway analysis tools by eQuilibrator
  license: MIT
  license_file: LICENSE
  description: >
    A command-line tool for pathway analysis based on Max-min Driving Force, or Enzyme Cost Minimization. These analyses are also available via a web interface at eQuilibrator (http://equilibrator.weizmann.ac.il/pathway).
  dev_url: https://gitlab.com/equilibrator/equilibrator-pathway

extra:
  recipe-maintainers:
    - eladnoor
